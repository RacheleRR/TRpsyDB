<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRpsyDB — Locus Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F2;--surface:#FFFFFF;--border:#E2E0D8;--text:#1A1917;--text-2:#6B6860;--text-3:#9E9B94;--purple:#5340C8;--purple-l:#EAE7FC;--purple-t:#3C3489;--teal:#0F6E56;--teal-l:#E1F5EE;--coral:#C04020;--coral-l:#FAECE7;--amber:#A05010;--amber-l:#FEF0DA;--blue:#1860A8;--blue-l:#E6F1FB;--gray-l:#F1EFE8;--mono:'IBM Plex Mono',monospace;--sans:'Syne',sans-serif;--body:'Inter',sans-serif;--r:6px;--rl:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:48px;gap:24px}
.nav-logo{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--purple);cursor:pointer}
.nav-link{font-size:13px;color:var(--text-2);text-decoration:none}
.nav-back{margin-left:auto;font-size:12px;color:var(--purple);cursor:pointer;display:flex;align-items:center;gap:4px}
.sh{position:sticky;top:48px;z-index:90;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:14px}
.ring{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--purple);background:var(--purple-l);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.ring-n{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--purple-t);line-height:1}
.ring-l{font-size:8px;color:var(--purple);line-height:1;margin-top:1px}
.sh-title{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text)}
.sh-coord{font-family:var(--mono);font-size:11px;color:var(--text-2);margin-top:2px}
.badges{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500}
.b-purple{background:var(--purple-l);color:var(--purple-t)}.b-teal{background:var(--teal-l);color:var(--teal)}
.b-coral{background:var(--coral-l);color:var(--coral)}.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-gray{background:var(--gray-l);color:#444}
.sh-stats{margin-left:auto;display:flex;gap:20px}
.sh-stat{text-align:center}
.sh-n{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);line-height:1}
.sh-l{font-size:9px;color:var(--text-3);margin-top:2px}
.page{max-width:900px;margin:0 auto;padding:24px}
.section{margin-bottom:20px;opacity:0;transform:translateY(10px);animation:fu .4s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.section:nth-child(1){animation-delay:.04s}.section:nth-child(2){animation-delay:.08s}
.section:nth-child(3){animation-delay:.12s}.section:nth-child(4){animation-delay:.16s}
.section:nth-child(5){animation-delay:.20s}.section:nth-child(6){animation-delay:.24s}
.section:nth-child(7){animation-delay:.28s}.section:nth-child(8){animation-delay:.32s}
.section:nth-child(9){animation-delay:.36s}.section:nth-child(10){animation-delay:.40s}
.st{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.csub{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{display:flex;gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kk{color:var(--text-2)}.kv-v{color:var(--text);font-weight:500}
.mono{font-family:var(--mono);font-size:10px}
.stat{background:var(--bg);border-radius:var(--r);padding:10px 12px;text-align:center}
.sn{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--text);line-height:1}
.sn.accent{color:var(--purple)}.sn.danger{color:var(--coral)}.sn.good{color:var(--teal)}
.sl{font-size:10px;color:var(--text-3);margin-top:3px}
.sep{border-top:1px solid var(--border);margin:10px 0}
.bw{margin-bottom:6px}
.bl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);margin-bottom:3px;align-items:center}
.bt{height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.flag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:3px;margin-right:4px;font-weight:500}
.fon{background:var(--teal-l);color:var(--teal);border:1px solid rgba(15,110,86,.2)}
.foff{background:var(--gray-l);color:var(--text-3);border:1px solid var(--border)}
.tier{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-left:5px;font-weight:500}
.t2{background:var(--purple-l);color:var(--purple-t)}.t3{background:var(--amber-l);color:var(--amber)}
.yes{color:var(--teal);font-weight:500}.no{color:var(--text-3)}
.note{font-size:10px;color:var(--text-3);margin-top:8px;font-style:italic}
.er{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.el{font-size:10px;color:var(--text-2);width:150px;flex-shrink:0;text-align:right}
.et{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.ef{height:100%;border-radius:3px}
.ev{font-size:10px;color:var(--text-3);width:32px;text-align:right;font-family:var(--mono)}
.sc{display:inline-block;font-size:10px;padding:2px 8px;border-radius:3px;border:1px solid var(--border);color:var(--text-2);margin:2px 3px 2px 0;font-family:var(--mono)}
.anat{background:var(--bg);border-radius:var(--r);width:80px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.loading-msg{text-align:center;padding:48px;color:var(--text-3);font-size:13px}
.error-msg{text-align:center;padding:48px;color:var(--coral);font-size:13px}
.qtl-loading{color:var(--text-3);font-size:11px;font-style:italic;margin-top:4px}
</style>
</head>
<body>

<nav>
  <span class="nav-logo" onclick="location.href='/'">TRpsyDB</span>
  <a class="nav-link" href="/">Browse</a>
  <span class="nav-back" onclick="history.back()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M10 12L6 8l4-4"/></svg>
    back
  </span>
</nav>

<!-- sticky header — populated after load -->
<div class="sh" id="sticky-header" style="display:none">
  <div class="ring"><span class="ring-n" id="sh-score">—</span><span class="ring-l">RExPRT</span></div>
  <div>
    <div class="sh-title" id="sh-title">Loading…</div>
    <div class="sh-coord" id="sh-coord"></div>
    <div class="badges" id="sh-badges"></div>
  </div>
  <div class="sh-stats">
    <div class="sh-stat"><div class="sh-n" id="sh-pli">—</div><div class="sh-l">pLi</div></div>
    <div class="sh-stat"><div class="sh-n" id="sh-loeuf">—</div><div class="sh-l">LOEUF</div></div>
    <div class="sh-stat"><div class="sh-n" id="sh-nsrc">—</div><div class="sh-l">catalogs</div></div>
    <div class="sh-stat"><div class="sh-n" id="sh-nqtl">—</div><div class="sh-l">QTL hits</div></div>
  </div>
</div>

<div class="page" id="page-content">
  <div class="loading-msg" id="loading-msg">Loading locus…</div>
</div>

<script>
const API = '';

// ── helpers ───────────────────────────────────────────────────────────────────
const fmt = v => v != null ? v : '—';
const fmtF = (v, d=2) => v != null ? (+v).toFixed(d) : '—';
const fmtE = v => v != null ? (+v).toExponential(2) : '—';
const yn = v => v ? '<span class="yes">✓</span>' : '<span class="no">—</span>';

function kv(k, v){ return `<div class="kv"><span class="kk">${k}</span><span class="kv-v">${v}</span></div>`; }
function kvMono(k, v){ return `<div class="kv"><span class="kk">${k}</span><span class="kv-v mono">${v}</span></div>`; }
function bar(label, val, p, color){
  return `<div class="bw"><div class="bl"><span><span class="dot" style="background:${color}"></span>${label}</span><span>β=${fmtF(val)} · p=${fmtE(p)}</span></div><div class="bt"><div class="bf" style="width:${Math.min((-Math.log10((p||1)+1e-300))/15*100,100)}%;background:${color}"></div></div></div>`;
}

// ── badges ────────────────────────────────────────────────────────────────────
function buildBadges(locus, established, regulatory, n_qtl){
  const out = [];
  if(established?.length) out.push(`<span class="badge b-purple">Mendelian — ${established[0].disease_name||'established'}</span>`);
  if(n_qtl > 0)           out.push(`<span class="badge b-teal">brain QTL</span>`);
  if(regulatory?.in_promoter)             out.push(`<span class="badge b-coral">promoter</span>`);
  if(regulatory?.in_brain_super_enhancer) out.push(`<span class="badge b-amber">brain SE</span>`);
  if(locus.has_eVNTR)     out.push(`<span class="badge b-blue">eVNTR</span>`);
  return out.join('');
}

// ── render full page ──────────────────────────────────────────────────────────
function renderPage(data){
  const { locus: l, established, clinvar, rexprt: rx, regulatory: reg,
          psychiatric, gene_evidence, phewas, sc_etr, qtls, n_qtl } = data;

  // sticky header
  document.getElementById('sh-score').textContent  = rx?.ensembleScore != null ? (+rx.ensembleScore).toFixed(2) : '—';
  document.getElementById('sh-title').textContent  = l.gene_name || l.tr_id;
  document.getElementById('sh-coord').textContent  = `${l.chr}:${(l.start||0).toLocaleString()}–${(l.end||0).toLocaleString()} · ${l.canonical_motif||'?'} · ${l.gene_region||'?'}`;
  document.getElementById('sh-badges').innerHTML   = buildBadges(l, established, reg, n_qtl);
  document.getElementById('sh-pli').textContent    = rx?.pLi != null ? (+rx.pLi).toFixed(3) : '—';
  document.getElementById('sh-loeuf').textContent  = rx?.loeuf != null ? (+rx.loeuf).toFixed(2) : '—';
  document.getElementById('sh-nsrc').textContent   = l.n_sources || '—';
  document.getElementById('sh-nqtl').textContent   = n_qtl || 0;
  document.getElementById('sticky-header').style.display = 'flex';

  const sections = [];

  // ① DISEASE (only if established)
  if(established?.length){
    const e = established[0];
    sections.push(`
      <div class="section">
        <div class="st">Disease / clinical</div>
        <div class="card">
          <div class="csub">${e.disease_name||'Established disease locus'} · ${e.gene_name||l.gene_name||''}</div>
          <div class="g4" style="margin-bottom:12px">
            <div class="stat"><div class="sn">${e.normal_min != null ? `${e.normal_min}–${e.normal_max}` : '—'}</div><div class="sl">normal (repeats)</div></div>
            <div class="stat"><div class="sn">${e.premut_min != null ? `${e.premut_min}–${e.premut_max}` : '—'}</div><div class="sl">intermediate</div></div>
            <div class="stat"><div class="sn danger">${e.pathogenic_min != null ? `≥ ${e.pathogenic_min}` : '—'}</div><div class="sl">pathogenic</div></div>
            <div class="stat"><div class="sn">${e.inheritance||'—'}</div><div class="sl">inheritance</div></div>
          </div>
          ${kv('Evidence tier','1 — established Mendelian disease locus')}
          ${kv('Repeat unit', e.repeat_unit || l.canonical_motif || '—')}
          ${e.pmid ? kv('PMID', `<span class="mono" style="color:var(--purple)">${e.pmid}</span>`) : ''}
        </div>
      </div>`);
  }

  // ② PSYCHIATRIC EVIDENCE
  const hasPsych = psychiatric?.length || gene_evidence?.length;
  if(hasPsych){
    sections.push(`
      <div class="section">
        <div class="st">Psychiatric evidence</div>
        <div class="g2">
          <div class="card">
            <div class="csub">This TR — literature mining</div>
            ${psychiatric?.length ? psychiatric.map(p => `
              <div class="kv">
                <span class="kk">${p.phenotype}</span>
                <span>
                  ${p.evidence_tier >= 2 ? `<span class="tier t${p.evidence_tier}">tier ${p.evidence_tier}</span>` : ''}
                  ${p.study_type ? `<span class="kv-v" style="margin-left:5px">${p.study_type}</span>` : ''}
                </span>
              </div>
              ${p.pmid ? `<div style="font-size:10px;color:var(--text-3);margin-bottom:4px">PMID: <span class="mono" style="color:var(--purple)">${p.pmid}</span></div>` : ''}
            `).join('') : '<div style="font-size:11px;color:var(--text-3)">No TR-level literature associations curated</div>'}
            ${established?.length ? '<div class="note">established Mendelian loci are tier 1 — see disease section above</div>' : ''}
          </div>
          <div class="card">
            <div class="csub">Gene ${l.gene_name||'—'} — exome &amp; GWAS evidence</div>
            ${gene_evidence?.length ? gene_evidence.map(g => `
              <div class="kv">
                <span class="kk">${g.source} (${g.phenotype})</span>
                <span class="kv-v" style="color:var(--purple)">
                  ${g.odds_ratio != null ? `OR ${(+g.odds_ratio).toFixed(2)} · ` : ''}${g.p_value != null ? `p = ${fmtE(g.p_value)}` : ''}
                </span>
              </div>`).join('') : '<div style="font-size:11px;color:var(--text-3)">No gene-level psychiatric evidence</div>'}
            <div class="note">evidence for the gene, not this specific TR</div>
          </div>
        </div>
      </div>`);
  }

  // ③ GENOMIC CONTEXT
  sections.push(`
    <div class="section">
      <div class="st">Genomic context</div>
      <div class="g2">
        <div class="card">
          <div class="csub">Locus identity</div>
          ${kv('Gene', l.gene_name || '—')}
          ${kv('Gene region', l.gene_region || '—')}
          ${kv('Gene ID', `<span class="mono">${l.gene_id || '—'}</span>`)}
          ${kvMono('Motif', l.canonical_motif || '—')}
          ${kv('Motif size', l.motif_size_bp != null ? `${l.motif_size_bp} bp` : '—')}
          ${kv('Repeats in reference', fmt(l.num_repeats_ref))}
          ${kv('Purity', fmtF(l.purity, 3))}
          ${kv('Mappability', fmtF(l.mappability, 3))}
        </div>
        <div class="card">
          <div class="csub">Position</div>
          ${kvMono('hg38', `${l.chr}:${(l.start||0).toLocaleString()}–${(l.end||0).toLocaleString()}`)}
          ${l.hg19_chr ? kvMono('hg19', `${l.hg19_chr}:${(l.hg19_start||0).toLocaleString()}–${(l.hg19_end||0).toLocaleString()}`) : ''}
          ${kv('Region size', l.start != null && l.end != null ? `${(l.end - l.start).toLocaleString()} bp` : '—')}
          ${kv('TSS distance', l.dist_tss_bp != null ? `${l.dist_tss_bp.toLocaleString()} bp → ${l.nearest_tss_gene||''}` : '—')}
          ${kv('Splice junction distance', l.dist_splice_bp != null ? `${l.dist_splice_bp.toLocaleString()} bp` : '—')}
        </div>
      </div>
    </div>`);

  // ④ FUNCTIONAL SCORES
  if(rx){
    sections.push(`
      <div class="section">
        <div class="st">Functional scores</div>
        <div class="card">
          <div class="g4" style="margin-bottom:12px">
            <div class="stat"><div class="sn accent">${fmtF(rx.ensembleScore)}</div><div class="sl">RExPRT ensemble</div></div>
            <div class="stat"><div class="sn">${fmtF(rx.pLi, 3)}</div><div class="sl">pLi</div></div>
            <div class="stat"><div class="sn">${fmtF(rx.loeuf, 2)}</div><div class="sl">LOEUF</div></div>
            <div class="stat"><div class="sn">${rx.SVM != null ? fmtF(rx.SVM) : '—'} / ${rx.XGB != null ? fmtF(rx.XGB) : '—'}</div><div class="sl">SVM / XGB</div></div>
          </div>
          <div class="sep"></div>
          <div style="font-size:10px;color:var(--text-3);margin-bottom:6px;font-weight:500">Feature flags</div>
          <span class="flag ${rx.eSTR ? 'fon' : 'foff'}">eSTR</span>
          <span class="flag ${rx.opReg ? 'fon' : 'foff'}">opReg</span>
          <span class="flag ${rx.promoter ? 'fon' : 'foff'}">promoter</span>
          <div class="note">RExPRT scores computed on hg19 · pLi and LOEUF from gnomAD via RExPRT</div>
        </div>
      </div>`);
  }

  // ⑤ REGULATORY CONTEXT
  if(reg){
    sections.push(`
      <div class="section">
        <div class="st">Regulatory context</div>
        <div class="g2">
          <div class="card">
            <div class="csub">Promoter &amp; open chromatin</div>
            ${kv('Promoter (EPD)', reg.in_promoter ? `<span class="yes">✓ ${reg.promoter_id||''}</span>` : '<span class="no">—</span>')}
            ${kv('ENCODE cCRE class', reg.ccre_class || '<span class="no">—</span>')}
            ${reg.ccre_id ? kvMono('cCRE accession', reg.ccre_id) : ''}
          </div>
          <div class="card">
            <div class="csub">Enhancers</div>
            ${kv('Brain super enhancer', reg.in_brain_super_enhancer ? `<span class="yes">✓ ${reg.n_super_enhancer_tissues||''} brain samples</span>` : '<span class="no">—</span>')}
            ${reg.SE_gene_ABC ? kv('SE linked gene (ABC)', reg.SE_gene_ABC) : ''}
            ${kv('Brain typical enhancer', reg.in_brain_enhancer ? `<span class="yes">✓</span>` : '<span class="no">—</span>')}
          </div>
        </div>
      </div>`);
  }

  // ⑥ BRAIN QTLs — FIX 4: show first 20, lazy load rest
  sections.push(`
    <div class="section">
      <div class="st">Brain QTLs <span style="font-weight:400;font-size:9px;margin-left:6px;color:var(--text-3)">${n_qtl} hits total</span></div>
      ${n_qtl === 0 ? '<div class="card" style="color:var(--text-3);font-size:12px">No brain QTL associations found for this locus</div>' : `
      <div class="g2" id="qtl-panel">
        <div class="card">
          <div class="csub" id="qtl-left-title">Loading QTLs…</div>
          <div id="qtl-left-content"><div class="qtl-loading">Fetching QTL data…</div></div>
        </div>
        <div class="card">
          <div class="csub" id="qtl-right-title">GTEx v8 · brain regions</div>
          <div id="qtl-right-content"><div class="qtl-loading">Fetching QTL data…</div></div>
        </div>
      </div>`}
    </div>`);

  // ⑦ GENE EXPRESSION
  sections.push(`
    <div class="section">
      <div class="st">Gene expression — ${l.gene_name||'?'} · GTEx v8</div>
      <div class="row" id="expr-panel" style="align-items:flex-start;gap:16px">
        <div style="color:var(--text-3);font-size:11px;margin-top:8px">Loading anatomogram…</div>
      </div>
    </div>`);

  // ⑧ PHEWAS
  if(phewas?.length){
    sections.push(`
      <div class="section">
        <div class="st">Phenotype associations (PheWAS)</div>
        <div class="card">
          ${phewas.map(p => `
            <div class="kv">
              <span class="kk">${p.trait||p.phenotype_code||'—'} <span style="font-size:10px;color:var(--text-3)">${p.source||''}</span></span>
              <span style="display:flex;align-items:center;gap:6px">
                <span class="kv-v" style="color:var(--purple)">${p.beta!=null?`β=${fmtF(p.beta)} · `:''}p=${fmtE(p.p_value)}</span>
                ${p.replicated_AoU ? '<span class="badge b-teal" style="font-size:9px">✓ AoU</span>' : ''}
              </span>
            </div>`).join('')}
        </div>
      </div>`);
  }

  // ⑨ SC-ETR
  if(sc_etr?.length){
    sections.push(`
      <div class="section">
        <div class="st">Single-cell expression QTL (Tanudisastro 2025)</div>
        <div class="card">
          <div class="g3" style="margin-bottom:12px">
            <div class="stat"><div class="sn accent">${sc_etr[0].cell_type||'—'}</div><div class="sl">cell type</div></div>
            <div class="stat"><div class="sn">${fmtF(sc_etr[0].PIP)}</div><div class="sl">PIP (causal prob.)</div></div>
            <div class="stat"><div class="sn ${sc_etr[0].coloc_mQTL?'good':''}" style="font-size:13px">${sc_etr[0].coloc_mQTL?'mQTL coloc':'No coloc'}</div><div class="sl">${sc_etr[0].coloc_mQTL?'colocalized':''}</div></div>
          </div>
          ${kv('β', fmtF(sc_etr[0].beta))}
          ${kv('p nominal', fmtE(sc_etr[0].p_value))}
          ${kv('FDR', fmtE(sc_etr[0].p_fdr))}
          ${kv('Gene affected', sc_etr[0].gene_affected||'—')}
          ${kv('Candidate causal (PIP ≥ 0.7)', sc_etr[0].candidate_causal ? '<span class="yes">✓</span>' : '<span class="no">—</span>')}
        </div>
      </div>`);
  }

  // ⑩ SOURCES
  const srcs = (l.source_catalogs||'').split(',').filter(Boolean);
  sections.push(`
    <div class="section">
      <div class="st">Sources</div>
      <div class="card">
        <div style="margin-bottom:10px">${srcs.map(s=>`<span class="sc">${s.trim()}</span>`).join('')||'—'}</div>
        <div class="g4">
          <div class="stat"><div class="sn">${l.n_sources||'—'}</div><div class="sl">catalogs</div></div>
          <div class="stat"><div class="sn">${fmtF(l.aou_median,1)}</div><div class="sl">AoU median</div></div>
          <div class="stat"><div class="sn">${fmtF(l.aou_stdev,1)}</div><div class="sl">AoU stdev</div></div>
          <div class="stat"><div class="sn">${fmtF(l.aou_max,0)}</div><div class="sl">AoU max allele</div></div>
        </div>
      </div>
    </div>`);

  // render
  document.getElementById('loading-msg').remove();
  document.getElementById('page-content').innerHTML = sections.join('');

  // FIX 4: lazy load QTLs and expression AFTER page renders
  if(n_qtl > 0) loadQTLsLazy(l.tr_id);
  if(l.gene_name)   loadExpressionLazy(l.gene_name);
}

// ── FIX 4: lazy QTL loading ───────────────────────────────────────────────────
async function loadQTLsLazy(tr_id){
  try {
    const r = await fetch(`${API}/api/loci/${tr_id}/qtls?limit=100`);
    const d = await r.json();
    const qtls = d.qtls || [];

    // group by cohort
    const rosmap = qtls.filter(q => q.cohort === 'ROSMAP');
    const gtex   = qtls.filter(q => q.cohort === 'GTEx_v8' && q.tissue.includes('Brain'));
    const nygcals= qtls.filter(q => q.cohort === 'NYGCALS');
    const others = qtls.filter(q => !['ROSMAP','GTEx_v8'].includes(q.cohort) && q.cohort !== 'NYGCALS');

    const colors = {eQTL:'var(--purple)',sQTL:'var(--purple)',hQTL:'var(--purple)',mQTL:'var(--purple)',caQTL:'var(--purple)','3aQTL':'var(--purple)'};
    const gtexColors = {'Brain_Cortex':'var(--blue)','Brain_Frontal_Cortex_Ba9':'var(--blue)','Brain_Hippocampus':'var(--blue)'};

    const leftTitle = document.getElementById('qtl-left-title');
    const leftContent = document.getElementById('qtl-left-content');
    if(leftTitle && leftContent){
      leftTitle.textContent = `ROSMAP · DLPFC${nygcals.length ? ' + NYGCALS' : ''}`;
      leftContent.innerHTML = [
        ...rosmap.slice(0,6).map(q => bar(`${q.tissue} · ${q.qtl_type}`, q.beta, q.p_value, 'var(--purple)')),
        ...nygcals.slice(0,4).map(q => bar(`${q.tissue} · ${q.qtl_type}`, q.beta, q.p_value, 'var(--teal)')),
        ...others.slice(0,2).map(q => bar(`${q.cohort} · ${q.qtl_type}`, q.beta, q.p_value, 'var(--coral)')),
      ].join('') || '<div class="no" style="font-size:11px">No ROSMAP/NYGCALS hits</div>';
    }

    const rightContent = document.getElementById('qtl-right-content');
    if(rightContent){
      rightContent.innerHTML = gtex.slice(0,6).map(q =>
        bar(q.tissue.replace('Brain_','').replace(/_/g,' '), q.beta, q.p_value, 'var(--blue)')
      ).join('') + (gtex.length > 6 ? `<div class="note">+ ${gtex.length-6} more brain regions</div>` : '') ||
      '<div class="no" style="font-size:11px">No GTEx brain hits</div>';
    }
  } catch(e) {
    const el = document.getElementById('qtl-left-content');
    if(el) el.innerHTML = `<div style="color:var(--text-3);font-size:11px">Could not load QTL data</div>`;
  }
}

// ── FIX 4: lazy expression loading ───────────────────────────────────────────
async function loadExpressionLazy(gene){
  try {
    const r = await fetch(`${API}/api/expression/${gene}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const brain = d.brain || [];
    const body  = (d.top_body || []).slice(0, 6);
    const maxTpm = Math.max(...brain.map(t=>t.median_tpm), ...body.map(t=>t.median_tpm), 1);

    const exprBars = document.getElementById('expr-bars');
    if(!exprBars) return;

    const barsHtml = [
      ...brain.slice(0,6).map(t => `
        <div class="er">
          <span class="el">${t.tissue_name}</span>
          <div class="et"><div class="ef" style="width:${Math.round(t.median_tpm/maxTpm*100)}%;background:var(--purple)"></div></div>
          <span class="ev">${t.median_tpm.toFixed(1)}</span>
        </div>`),
      brain.length > 0 && body.length > 0 ? '<div class="sep"></div>' : '',
      ...body.map(t => `
        <div class="er">
          <span class="el">${t.tissue_name}</span>
          <div class="et"><div class="ef" style="width:${Math.round(t.median_tpm/maxTpm*100)}%;background:var(--teal)"></div></div>
          <span class="ev">${t.median_tpm.toFixed(1)}</span>
        </div>`),
    ].join('');

    exprBars.innerHTML = `
      <div style="font-size:10px;font-weight:500;color:var(--text-3);margin-bottom:7px">median TPM · purple = brain · green = other tissues · source: GTEx v8</div>
      ${barsHtml}`;
  } catch(e) {
    const el = document.getElementById('expr-bars');
    if(el) el.innerHTML = `<div style="color:var(--text-3);font-size:11px">Expression data unavailable for this gene</div>`;
  }
}

// ── Main: get tr_id from URL and load ─────────────────────────────────────────
async function init(){
  const params = new URLSearchParams(window.location.search);
  const trId   = params.get('id');

  if(!trId){
    document.getElementById('page-content').innerHTML =
      '<div class="error-msg">No locus ID specified. <a href="/" style="color:var(--purple)">Go to browse</a></div>';
    return;
  }

  try {
    const r = await fetch(`${API}/api/loci/${trId}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    renderPage(data);
  } catch(e) {
    document.getElementById('page-content').innerHTML =
      `<div class="error-msg">Error loading locus: ${e.message}</div>`;
  }
}

init();
</script>
